<svg width="560" height="520" viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg">
  <circle cx="300" cy="260" r="230" fill="#F0FDFA" />
  <circle cx="300" cy="260" r="175" fill="#CCFBF1" />

  <!-- Hospital building -->
  <rect x="160" y="180" width="220" height="260" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="3" />
  <rect x="160" y="180" width="220" height="46" rx="10" fill="#0F766E" />
  <rect x="264" y="196" width="32" height="14" rx="3" fill="#FFFFFF" />
  <rect x="273" y="187" width="14" height="32" rx="3" fill="#FFFFFF" />

  <!-- Windows -->
  <rect x="184" y="250" width="30" height="30" rx="4" fill="#99F6E4" />
  <rect x="228" y="250" width="30" height="30" rx="4" fill="#99F6E4" />
  <rect x="282" y="250" width="30" height="30" rx="4" fill="#99F6E4" />
  <rect x="326" y="250" width="30" height="30" rx="4" fill="#99F6E4" />

  <rect x="184" y="300" width="30" height="30" rx="4" fill="#99F6E4" />
  <rect x="228" y="300" width="30" height="30" rx="4" fill="#99F6E4" />
  <rect x="282" y="300" width="30" height="30" rx="4" fill="#99F6E4" />
  <rect x="326" y="300" width="30" height="30" rx="4" fill="#99F6E4" />

  <rect x="184" y="350" width="30" height="30" rx="4" fill="#99F6E4" />
  <rect x="326" y="350" width="30" height="30" rx="4" fill="#99F6E4" />

  <!-- Entrance door -->
  <rect x="248" y="360" width="64" height="80" rx="4" fill="#0F766E" />
  <rect x="278" y="360" width="4" height="80" fill="#F0FDFA" />

  <!-- Ambulance -->
  <g transform="translate(60,380)">
    <rect x="0" y="10" width="90" height="44" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="3" />
    <rect x="8" y="18" width="26" height="20" rx="3" fill="#CCFBF1" />
    <rect x="40" y="26" width="14" height="4" fill="#F43F5E" />
    <rect x="45" y="21" width="4" height="14" fill="#F43F5E" />
    <circle cx="20" cy="58" r="9" fill="#111827" />
    <circle cx="70" cy="58" r="9" fill="#111827" />
    <circle cx="20" cy="58" r="4" fill="#CBD5E1" />
    <circle cx="70" cy="58" r="4" fill="#CBD5E1" />
  </g>

  <!-- Cross badge floating -->
  <g transform="translate(400,120)">
    <circle cx="0" cy="0" r="30" fill="#0F766E" />
    <rect x="-4" y="-16" width="8" height="32" rx="2" fill="#FFFFFF" />
    <rect x="-16" y="-4" width="32" height="8" rx="2" fill="#FFFFFF" />
  </g>

  <!-- Heartbeat pulse line -->
  <polyline points="60,150 110,150 130,110 155,190 175,150 220,150" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Decorative dots -->
  <circle cx="440" cy="360" r="12" fill="#0F766E" opacity="0.5" />
  <circle cx="120" cy="120" r="8" fill="#0F766E" opacity="0.4" />
  <circle cx="470" cy="230" r="6" fill="#0F766E" opacity="0.5" />
